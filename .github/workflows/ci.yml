name: openshot-qt CI Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      ARM64_INTEGRATION: ${{ github.head_ref == 'arm64-support' || github.ref_name == 'arm64-support' || github.base_ref == 'arm64-support' }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Check out integration audio
      if: env.ARM64_INTEGRATION == 'true'
      uses: actions/checkout@v7
      with:
        repository: OpenShot/libopenshot-audio
        ref: arm64-support
        path: integration/audio

    - name: Check out integration library
      if: env.ARM64_INTEGRATION == 'true'
      uses: actions/checkout@v7
      with:
        repository: OpenShot/libopenshot
        ref: arm64-support
        path: integration/libopenshot

    - name: Install packaged OpenShot dependencies
      if: env.ARM64_INTEGRATION != 'true'
      run: |
        sudo add-apt-repository ppa:openshot.developers/libopenshot-daily
        sudo apt update
        sudo apt install libopenshot-audio-dev libopenshot-dev python3-openshot

    - name: Build integration libraries
      if: env.ARM64_INTEGRATION == 'true'
      run: |
        sudo apt update
        sudo apt install -y cmake swig python3-dev libasound2-dev \
          qtbase5-dev libqt5svg5-dev libavcodec-dev libavdevice-dev \
          libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
          libbabl-dev libopencv-dev libprotobuf-dev protobuf-compiler libjsoncpp-dev
        prefix="$RUNNER_TEMP/openshot-integration"
        cmake -S integration/audio -B integration/audio/build \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
        cmake --build integration/audio/build --parallel 2
        cmake --install integration/audio/build
        cmake -S integration/libopenshot -B integration/libopenshot/build \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
          -DCMAKE_PREFIX_PATH="$prefix" -DPYTHON_MODULE_PATH=python \
          -DPYTHON_EXECUTABLE=/usr/bin/python3 -DBUILD_TESTING=OFF \
          -DENABLE_LIB_DOCS=OFF -DUSE_QT6=OFF
        cmake --build integration/libopenshot/build --parallel 2
        cmake --install integration/libopenshot/build
        echo "PYTHONPATH=$prefix/python" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        sudo apt install qttranslations5-l10n libssl-dev xvfb
        sudo apt install python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtopengl python3-xdg
        pip3 install setuptools wheel sentry-sdk dbus-next==0.2.3
        pip3 install cx_Freeze==7.0.0 distro defusedxml requests certifi chardet urllib3

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen
      run: python3 -m unittest discover -s src/tests -t src/tests --quiet

    - name: Test package layout
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python3 setup.py build --build-base build/ppa-tests
        cd build/ppa-tests/lib
        python3 -m unittest discover --quiet

  portable-title-controls:
    name: Qt widget and CLI compatibility (${{ matrix.os }}, ${{ matrix.qt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        qt: [PyQt5, PyQt6, PySide6]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Linux Qt runtime dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1
    - name: Install Qt
      run: python -m pip install ${{ matrix.qt }} defusedxml
    - name: Configure Windows fonts for offscreen Qt tests
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_ENV -Value "QT_QPA_FONTDIR=$env:WINDIR/Fonts"
    - name: Test native SVG file watching and shared toggles
      env:
        PYTHONPATH: src
        QT_QPA_PLATFORM: offscreen
        OPENSHOT_QT_API: ${{ matrix.qt }}
      run: python -m unittest tests.test_qt_api tests.test_svg_watcher tests.test_preference_switch tests.test_toggle_switch tests.test_cli_entrypoints -v
