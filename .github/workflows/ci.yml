name: openshot-qt CI Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo add-apt-repository ppa:openshot.developers/libopenshot-daily
        sudo apt update
        sudo apt install libopenshot-audio-dev libopenshot-dev python3-openshot
        sudo apt install qttranslations5-l10n libssl-dev xvfb
        sudo apt install python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtopengl python3-xdg
        pip3 install setuptools wheel sentry-sdk dbus-next==0.2.3
        pip3 install cx_Freeze==7.0.0 distro defusedxml requests certifi chardet urllib3

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen
      run: python3 -m unittest discover -s src/tests -t src/tests --quiet

    - name: Test package layout
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python3 setup.py build --build-base build/ppa-tests
        cd build/ppa-tests/lib
        python3 -m unittest discover --quiet

  portable-title-controls:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        qt: [PyQt5, PyQt6]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Linux Qt runtime dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1
    - name: Install Qt
      run: python -m pip install ${{ matrix.qt }} defusedxml
    - name: Test native SVG file watching and preference toggles
      env:
        PYTHONPATH: src
        QT_QPA_PLATFORM: offscreen
        OPENSHOT_QT_API: ${{ matrix.qt }}
      run: python -m unittest tests.test_svg_watcher tests.test_preference_switch -v
