# ─────────────────────────────────────────────────────────────────────────────
# Zenvi — Release Workflow
#
# Triggers when a version tag (v*.*.*) is pushed. Builds platform-specific
# installers and publishes them as a GitHub Release so the in-app auto-updater
# can pick them up.
#
# Asset naming convention expected by the auto-updater:
#   Linux   → Zenvi-v<VER>-x86_64.AppImage
#   macOS   → Zenvi-v<VER>-x86_64.dmg
#   Windows → Zenvi-v<VER>-x86_64.exe
# ─────────────────────────────────────────────────────────────────────────────
name: Zenvi Production Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed for creating releases & uploading assets

env:
  # Parsed from src/classes/info.py at build time
  APP_NAME: Zenvi

jobs:

  # ── 1. Read the version from source so every job can reference it ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from info.py
        id: ver
        run: |
          VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/classes/info.py').read_text()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${VER}"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Linux build (AppImage + .deb) ──────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:openshot.developers/libopenshot-daily
          sudo apt-get update
          sudo apt-get install -y \
            libopenshot-audio-dev libopenshot-dev python3-openshot \
            python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine \
            python3-pyqt5.qtopengl python3-zmq python3-xdg \
            libfuse2 desktop-file-utils

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Freeze with cx_Freeze
        run: python3 freeze.py build --git-branch=production

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool && chmod +x appimagetool

          # Create AppDir structure
          APPDIR="Zenvi.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/metainfo"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$APPDIR/usr/bin/"

          # Desktop file
          cp xdg/*.desktop "$APPDIR/usr/share/applications/" 2>/dev/null || true
          cp xdg/*.desktop "$APPDIR/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$APPDIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
            cp "$ICON" "$APPDIR/zenvi.png"
          fi

          # AppRun
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/launch" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" \
            "Zenvi-v${VER}-x86_64.AppImage"

      - name: Build .deb package
        run: |
          DEB_DIR="zenvi_${VER}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/zenvi"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$DEB_DIR/usr/share/zenvi/"

          # Launcher script
          cat > "$DEB_DIR/usr/bin/zenvi" << 'LAUNCHER'
          #!/bin/bash
          exec /usr/share/zenvi/launch "$@"
          LAUNCHER
          chmod +x "$DEB_DIR/usr/bin/zenvi"

          # Desktop file
          cp xdg/*.desktop "$DEB_DIR/usr/share/applications/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
          fi

          # Control file
          cat > "$DEB_DIR/DEBIAN/control" << CTRL
          Package: zenvi
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libopenshot-dev, python3
          Maintainer: Zenvi Team <team@zenvi.org>
          Description: Zenvi Video Editor
           Create and edit stunning videos, films, and animations.
          CTRL

          dpkg-deb --build "$DEB_DIR" "Zenvi-v${VER}-x86_64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            Zenvi-v*.AppImage
            Zenvi-v*.deb

  # ── 3. macOS build (.dmg) ─────────────────────────────────────────────
  build-macos:
    needs: version
    runs-on: macos-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Homebrew does not provide an `openshot` formula; install the official app cask.
          brew install --cask openshot-video-editor

          # Locate the OpenShot Python bindings bundled inside the OpenShot app.
          # We pass this path via ZENVI_OPENSHOT_PYROOT so freeze.py can append it to sys.path
          # (without poisoning PYTHONPATH and breaking Python startup).
          OPENSHOT_APP="$(find /Applications -maxdepth 2 -type d -name '*OpenShot*.app' 2>/dev/null | head -n 1 || true)"
          if [ -z "$OPENSHOT_APP" ]; then
            # Sometimes casks may be staged in the Caskroom; try there too.
            CASKROOM="$(brew --prefix)/Caskroom"
            OPENSHOT_APP="$(find "$CASKROOM" -maxdepth 5 -type d -name '*OpenShot*.app' 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$OPENSHOT_APP" ]; then
            echo "::error::OpenShot .app bundle not found after installing cask"
            exit 1
          fi

          echo "OpenShot app: $OPENSHOT_APP"

          # Prefer an actual Python wrapper/package over the raw native module.
          HIT_INIT="$(find "$OPENSHOT_APP" -type f -path '*/openshot/__init__.py' 2>/dev/null | head -n 1 || true)"
          HIT_PY="$(find "$OPENSHOT_APP" -type f -name 'openshot.py' 2>/dev/null | head -n 1 || true)"
          HIT_SO="$(find "$OPENSHOT_APP" -type f -name '_openshot*.so' 2>/dev/null | head -n 1 || true)"

          if [ -n "$HIT_INIT" ]; then
            HIT="$HIT_INIT"
          elif [ -n "$HIT_PY" ]; then
            HIT="$HIT_PY"
          elif [ -n "$HIT_SO" ]; then
            HIT="$HIT_SO"
          else
            echo "::error::Could not locate OpenShot Python bindings inside the app bundle"
            exit 1
          fi

          if echo "$HIT" | grep -q '/openshot/__init__.py$'; then
            OPENSHOT_PKG_DIR="$(dirname "$HIT")"              # .../openshot
            OPENSHOT_PYROOT="$(dirname "$OPENSHOT_PKG_DIR")"  # .../(site-packages)
          elif echo "$HIT" | grep -q '/openshot.py$'; then
            OPENSHOT_PYROOT="$(dirname "$HIT")"
          else
            # Found only the native module. This isn't importable as `openshot` unless
            # the corresponding wrapper (openshot.py or openshot package) exists nearby.
            OPENSHOT_BIND_DIR="$(dirname "$HIT")"
            if [ -f "$OPENSHOT_BIND_DIR/openshot.py" ]; then
              OPENSHOT_PYROOT="$OPENSHOT_BIND_DIR"
            else
              echo "::error::Found native module $HIT but no openshot.py wrapper next to it"
              echo "Hint: OpenShot cask may not ship Python wrapper bindings on this runner."
              exit 1
            fi
          fi

          echo "ZENVI_OPENSHOT_PYROOT=$OPENSHOT_PYROOT" >> "$GITHUB_ENV"
          echo "Found OpenShot bindings at: $HIT"

          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyobjc-framework-Cocoa 2>/dev/null || true

      - name: Verify OpenShot Python bindings (macOS)
        run: |
          python3 -c "import os, sys; p=os.environ.get('ZENVI_OPENSHOT_PYROOT'); print('ZENVI_OPENSHOT_PYROOT=', p); sys.path.append(p); import openshot; print('openshot=', getattr(openshot, '__file__', openshot))"

      - name: Freeze with cx_Freeze
        run: python3 freeze.py bdist_mac --git-branch=production

      - name: Create DMG
        run: |
          # cx_Freeze must produce a real .app bundle for a launchable DMG
          APP_BUNDLE=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found under build/ (cx_Freeze bdist_mac failed)"
            find build -maxdepth 3 -type d -print || true
            exit 1
          fi

          DMG_NAME="Zenvi-v${VER}-x86_64.dmg"

          # Build a standard DMG root (App + /Applications link)
          rm -rf dmgroot
          mkdir -p dmgroot
          cp -R "$APP_BUNDLE" dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create -volname "Zenvi" \
            -srcfolder "dmgroot" \
            -ov -format UDZO \
            "$DMG_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: Zenvi-v*.dmg
          if-no-files-found: error

  # ── 4. Windows build (.exe) ───────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        shell: powershell

      - name: Install OpenShot (libopenshot Python bindings)
        shell: powershell
        run: |
          choco install openshot -y --no-progress

          $roots = @(
            "C:\Program Files\OpenShot Video Editor",
            "C:\Program Files (x86)\OpenShot Video Editor"
          )

          $initPy = $null
          $pyd = $null
          $foundRoot = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              # Prefer locating the real Python package root (site-packages parent),
              # so we don't accidentally shadow stdlib modules (e.g. encodings).
              $initPy = Get-ChildItem -Path $root -Recurse -Filter "__init__.py" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\openshot\\__init__\.py$" } |
                Select-Object -First 1
              if ($initPy) { $foundRoot = $root; break }

              $pyd = Get-ChildItem -Path $root -Recurse -Filter "_openshot.pyd" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($pyd) { $foundRoot = $root; break }
            }
          }

          if (-not $foundRoot) {
            throw "Could not locate OpenShot installation root"
          }

          $installRoot = $foundRoot
          $bindDir = $null
          $pythonPathRoot = $null

          if ($initPy) {
            $bindDir = Split-Path -Parent $initPy.FullName   # ...\openshot
            $pythonPathRoot = Split-Path -Parent $bindDir    # ...\site-packages
          } elseif ($pyd) {
            $bindDir = $pyd.Directory.FullName
            $pythonPathRoot = $bindDir
            if ($pyd.Directory.Name -ieq "openshot") {
              $pythonPathRoot = $pyd.Directory.Parent.FullName
            }
          }

          if (-not $bindDir -or -not $pythonPathRoot) {
            throw "Could not determine Python path root for OpenShot bindings"
          }

          $binDir = Join-Path $installRoot "bin"

          Write-Host "OpenShot install root: $installRoot"
          Write-Host "OpenShot bindings dir: $bindDir"
          Write-Host "OpenShot PYTHONPATH root: $pythonPathRoot"

          # IMPORTANT:
          # Do NOT set PYTHONPATH here. Some OpenShot distributions bundle a partial/alternate
          # Python stdlib under their install tree, which can shadow stdlib modules (e.g.
          # encodings) and crash Python during initialization.
          #
          # Instead, pass the path to freeze.py via a dedicated env var, and let freeze.py
          # append it to sys.path at runtime (after Python has initialized).
          Add-Content $env:GITHUB_ENV "PYTHONPATH="
          Add-Content $env:GITHUB_ENV "ZENVI_OPENSHOT_PYROOT=$pythonPathRoot"
          Add-Content $env:GITHUB_ENV "ZENVI_OPENSHOT_BINDDIR=$bindDir"
          if (Test-Path $binDir) {
            Add-Content $env:GITHUB_ENV "PATH=$bindDir;$binDir;$installRoot;$env:PATH"
          } else {
            Add-Content $env:GITHUB_ENV "PATH=$bindDir;$installRoot;$env:PATH"
          }

      - name: Verify OpenShot Python bindings
        shell: powershell
        run: |
          python -c "import os, sys; print(sys.version); print('PYTHONPATH:', os.environ.get('PYTHONPATH')); sys.path.append(os.environ['ZENVI_OPENSHOT_PYROOT']); import openshot; print('openshot:', getattr(openshot, '__file__', openshot))"

      - name: Freeze with cx_Freeze
        run: python freeze.py build --git-branch=production

      - name: Build with Inno Setup
        run: |
          # Download and install Inno Setup if not present
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile is_setup.exe
            Start-Process -Wait -FilePath .\is_setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES"
          }

          # Build installer (deterministically name output + package correct cx_Freeze dir)
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $ISCC)) { throw "Inno Setup compiler not found at $ISCC" }

          $exeDir = Get-ChildItem -Path "build" -Directory -Filter "exe.*" | Select-Object -First 1
          if (!$exeDir) { throw "cx_Freeze output directory build/exe.* not found" }
          $pyExeDir = $exeDir.Name

          & $ISCC `
            /DVERSION="${env:VER}" `
            /DPY_EXE_DIR="$pyExeDir" `
            /F"Zenvi-v${env:VER}-x86_64" `
            /O"." `
            installer/windows-installer.iss

          if (!(Test-Path "Zenvi-v${env:VER}-x86_64.exe")) {
            throw "Expected installer Zenvi-v${env:VER}-x86_64.exe not created"
          }
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Zenvi-v*.exe
          if-no-files-found: error

  # ── 5. Create GitHub Release with all artifacts ───────────────────────
  # Run even if some platform builds fail so that successful artifacts
  # (e.g. Linux + Windows) still get published.
  release:
    needs: [version, build-linux, build-macos, build-windows]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
        continue-on-error: true   # some platform artifacts may be missing

      - name: Ensure at least one artifact exists
        run: |
          mkdir -p dist
          COUNT=$(find dist/ -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No build artifacts found — all platform builds failed"
            exit 1
          fi
          echo "Found $COUNT artifact(s)"

      - name: List artifacts
        run: |
          echo "### Release Artifacts" >> "$GITHUB_STEP_SUMMARY"
          find dist/ -type f | while read f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "?")
            SHA=$(sha256sum "$f" | cut -d' ' -f1)
            echo "- $(basename $f)  ($SIZE bytes, sha256: $SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "$SHA  $(basename $f)" >> dist/SHA256SUMS.txt
          done

      - name: Remove legacy production release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view production >/dev/null 2>&1; then
            gh release delete production --yes --cleanup-tag || true
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/production" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/production" || true
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Zenvi ${{ env.TAG }}"
          body: |
            ## Zenvi ${{ env.VER }}

            ### Auto-update
            Users running Zenvi with an active internet connection will receive
            this update automatically.  The download happens silently in the
            background and the new version is applied on the next launch.

            ### Manual download
            | Platform | File |
            |----------|------|
            | Linux (AppImage) | `Zenvi-v${{ env.VER }}-x86_64.AppImage` |
            | Linux (Debian)   | `Zenvi-v${{ env.VER }}-x86_64.deb` |
            | macOS (DMG)      | `Zenvi-v${{ env.VER }}-x86_64.dmg` |
            | Windows (EXE)    | `Zenvi-v${{ env.VER }}-x86_64.exe` |

            ### Checksums
            See `SHA256SUMS.txt` attached to this release.
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
