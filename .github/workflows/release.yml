name: Build & Release (Windows + macOS)

on:
  push:
    branches:
      - harkit-new

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Resolve the next semantic version tag once
  # ──────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history for tags

      - name: Determine next version
        id: bump
        run: |
          # Fetch all tags explicitly (shallow clones sometimes miss them)
          git fetch --tags --force

          # Get the latest vX.Y.Z tag sorted by version
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Strip the leading 'v' and split
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"

          # Bump patch version
          PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "new_tag=$NEW_TAG"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Next release: $NEW_TAG"

  # ──────────────────────────────────────────────
  # 2. Build libopenshot Python bindings (macOS)
  #    openshot is a C++ SWIG extension — not on PyPI.
  #    We build it here and pass the .so + .py as
  #    artifacts to the main macOS build job.
  # ──────────────────────────────────────────────
  build-libopenshot-macos:
    runs-on: macos-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout libopenshot-audio
        uses: actions/checkout@v4
        with:
          repository: OpenShot/libopenshot-audio
          path: libopenshot-audio

      - name: Checkout libopenshot
        uses: actions/checkout@v4
        with:
          repository: OpenShot/libopenshot
          path: libopenshot

      - name: Install build dependencies
        run: |
          # ffmpeg@5 is required: libopenshot 0.5.x uses APIs removed in FFmpeg 6.1+
          # (AVStream.nb_side_data, av_stream_add_side_data, FF_PROFILE_H264_BASELINE)
          brew install cmake swig zeromq cppzmq ffmpeg@5 pkg-config qt@5 libomp || true

      - name: Build libopenshot-audio
        run: |
          cmake -B libopenshot-audio/build -S libopenshot-audio \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/.install \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5)
          cmake --build libopenshot-audio/build -j$(sysctl -n hw.logicalcpu)
          cmake --install libopenshot-audio/build

      - name: Build libopenshot (Python bindings)
        run: |
          LIBOMP_PREFIX=$(brew --prefix libomp)
          # Point pkg-config at ffmpeg@5 (keg-only, not auto-linked)
          export PKG_CONFIG_PATH="$(brew --prefix ffmpeg@5)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake -B libopenshot/build -S libopenshot \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/.install \
            -DOpenShotAudio_ROOT=${{ github.workspace }}/.install \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DPYTHON_MODULE_PATH=python \
            -DENABLE_RUBY=OFF \
            -DENABLE_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5);${LIBOMP_PREFIX}" \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES="omp" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib"
          cmake --build libopenshot/build -j$(sysctl -n hw.logicalcpu)
          cmake --install libopenshot/build

      - name: Collect Python bindings + native libs
        run: |
          mkdir -p openshot-pkg
          cp ${{ github.workspace }}/.install/python/openshot.py openshot-pkg/
          cp ${{ github.workspace }}/.install/python/_openshot*.so openshot-pkg/
          # Include dylibs so _openshot.so can resolve them at import time
          cp ${{ github.workspace }}/.install/lib/libopenshot*.dylib openshot-pkg/ 2>/dev/null || true
          cp ${{ github.workspace }}/.install/lib/libopenshot-audio*.dylib openshot-pkg/ 2>/dev/null || true
          ls -la openshot-pkg/

      - name: Upload openshot macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openshot-pkg-macos
          path: openshot-pkg/

  # ──────────────────────────────────────────────
  # 3. Build libopenshot Python bindings (Windows)
  # ──────────────────────────────────────────────
  build-libopenshot-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-cppzmq
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg

      - name: Checkout libopenshot-audio
        uses: actions/checkout@v4
        with:
          repository: OpenShot/libopenshot-audio
          path: libopenshot-audio

      - name: Checkout libopenshot
        uses: actions/checkout@v4
        with:
          repository: OpenShot/libopenshot
          path: libopenshot

      - name: Build libopenshot-audio
        run: |
          cmake -B libopenshot-audio/build -S libopenshot-audio \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DCMAKE_CXX_FLAGS="-DJUCE_ASIO=0"
          cmake --build libopenshot-audio/build -j$(nproc)
          cmake --install libopenshot-audio/build

      - name: Build libopenshot (Python bindings)
        run: |
          cmake -B libopenshot/build -S libopenshot \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DOpenShotAudio_ROOT=/mingw64 \
            -DPYTHON_EXECUTABLE=/mingw64/bin/python3 \
            -DPYTHON_MODULE_PATH=python \
            -DENABLE_RUBY=OFF \
            -DENABLE_TESTS=OFF \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build libopenshot/build -j$(nproc)
          cmake --install libopenshot/build

      - name: Collect Python bindings + native DLLs
        run: |
          mkdir -p openshot-pkg
          cp /mingw64/python/openshot.py openshot-pkg/
          # Extension may be .pyd or .so depending on MSYS2 Python version
          find /mingw64/python -name "_openshot*" -exec cp {} openshot-pkg/ \; 2>/dev/null || true
          # Include DLLs required by the extension at runtime
          find /mingw64/bin -name "libopenshot*.dll" -exec cp {} openshot-pkg/ \; 2>/dev/null || true
          ls -la openshot-pkg/

      - name: Upload openshot Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openshot-pkg-windows
          path: openshot-pkg/

  # ──────────────────────────────────────────────
  # 4. Windows build  (MSYS2 / MinGW-w64)
  # ──────────────────────────────────────────────
  build-windows:
    needs: [version, build-libopenshot-windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-pyqt5
            mingw-w64-x86_64-python-cx-freeze
            mingw-w64-x86_64-python-pyzmq
            mingw-w64-x86_64-python-requests
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-certifi
            mingw-w64-x86_64-python-chardet
            mingw-w64-x86_64-python-urllib3
            mingw-w64-x86_64-python-defusedxml
            mingw-w64-x86_64-python-distro
            mingw-w64-x86_64-ffmpeg

      - name: Download openshot Python bindings
        uses: actions/download-artifact@v4
        with:
          name: openshot-pkg-windows
          path: openshot-pkg

      - name: Install openshot module
        run: |
          # Copy to project root so freeze.py finds it via the working directory
          cp openshot-pkg/openshot.py .
          find openshot-pkg -name "_openshot*" -exec cp {} . \;
          # Also install into site-packages so cx_Freeze can locate the module
          PY_SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          cp openshot-pkg/openshot.py "$PY_SITE/"
          find openshot-pkg -name "_openshot*" -exec cp {} "$PY_SITE/" \;
          # Put native DLLs on PATH
          cp openshot-pkg/*.dll /mingw64/bin/ 2>/dev/null || true

      - name: Install remaining pip packages
        run: |
          pip install sentry-sdk wheel markdown websocket-client python-dotenv || true

      - name: Build frozen executable
        run: |
          python freeze.py build --git-branch=${{ github.ref_name }}

      - name: Build MSI installer
        run: |
          python freeze.py bdist_msi --git-branch=${{ github.ref_name }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Copy the MSI(s) produced by cx_Freeze
          Get-ChildItem -Path build -Recurse -Filter *.msi | Copy-Item -Destination artifacts/
          # Also zip the frozen build directory as a portable archive
          $exeDir = Get-ChildItem -Path build -Directory | Where-Object { $_.Name -like "exe.*" } | Select-Object -First 1
          if ($exeDir) {
            Compress-Archive -Path $exeDir.FullName -DestinationPath "artifacts/Zenvi-${{ needs.version.outputs.version }}-win64-portable.zip"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/*
          retention-days: 5

  # ──────────────────────────────────────────────
  # 5. macOS build
  # ──────────────────────────────────────────────
  build-macos:
    needs: [version, build-libopenshot-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download openshot Python bindings
        uses: actions/download-artifact@v4
        with:
          name: openshot-pkg-macos
          path: openshot-pkg

      - name: Install openshot module
        run: |
          # Copy to project root so freeze.py finds it
          cp openshot-pkg/openshot.py .
          cp openshot-pkg/_openshot*.so .
          # Expose native dylibs so _openshot.so can resolve its dependencies
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/openshot-pkg:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install system dependencies (Homebrew)
        run: |
          brew install ffmpeg librsvg cairo pango pkg-config || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install PyQt5 PyQtWebEngine
          pip install cx_Freeze==7.0.0 sentry-sdk pyzmq requests certifi \
                      chardet urllib3 defusedxml distro markdown \
                      websocket-client python-dotenv

      - name: Build frozen app bundle
        run: |
          python3 freeze.py build --git-branch=${{ github.ref_name }}

      - name: Package macOS app
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          # Find the frozen build dir
          EXE_DIR=$(find build -maxdepth 1 -type d -name "exe.*" | head -n1)
          if [ -n "$EXE_DIR" ]; then
            zip -r "artifacts/Zenvi-${VERSION}-macos.zip" "$EXE_DIR"
          else
            echo "No frozen build directory found"
            ls -la build/
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: artifacts/*
          retention-days: 5

  # ──────────────────────────────────────────────
  # 6. Create GitHub Release with tag
  # ──────────────────────────────────────────────
  release:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: "Zenvi ${{ needs.version.outputs.new_tag }}"
          body: |
            ## Zenvi ${{ needs.version.outputs.new_tag }}

            Automated release from `${{ github.ref_name }}` branch.

            **Commit:** ${{ github.sha }}

            ### Downloads
            - **Windows** — MSI installer + portable ZIP
            - **macOS** — DMG disk image

            ---
            _Built by GitHub Actions on ${{ github.event.head_commit.timestamp }}_
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/windows-build/*
            release-assets/macos-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
