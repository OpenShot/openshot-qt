# ─────────────────────────────────────────────────────────────────────────────
# Zenvi — Production Release Workflow
#
# Triggers when a version tag (v*.*.*) is pushed, OR on push to the
# `production` branch.  Builds platform-specific installers and publishes
# them as a GitHub Release so the in-app auto-updater can pick them up.
#
# Asset naming convention expected by the auto-updater:
#   Linux   → Zenvi-v<VER>-x86_64.AppImage
#   macOS   → Zenvi-v<VER>-x86_64.dmg  (Intel)
#             Zenvi-v<VER>-arm64.dmg    (Apple Silicon)
#   Windows → Zenvi-v<VER>-x86_64.exe
#
# Security note:
#   Builds are ad-hoc signed (no Apple Developer or Windows code-signing cert).
#   macOS users: right-click the app → Open to bypass Gatekeeper (first launch only).
#   Windows users: click "More info" → "Run anyway" on the SmartScreen dialog.
#   To enable full signing, set SIGN_IDENTITY / WINDOWS_CERT GitHub Secrets.
# ─────────────────────────────────────────────────────────────────────────────
name: Zenvi Production Release

on:
  push:
    branches: [production]
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed for creating releases & uploading assets

env:
  APP_NAME: Zenvi

jobs:

  # ── 1. Read the version from source so every job can reference it ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from info.py
        id: ver
        run: |
          VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/classes/info.py').read_text()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"
          echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Linux build (AppImage + .deb) ──────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:openshot.developers/libopenshot-daily
          sudo apt-get update
          sudo apt-get install -y \
            libopenshot-audio-dev libopenshot-dev python3-openshot \
            python3-pyqt5 python3-pyqt5.qtsvg python3-pyqt5.qtwebengine \
            python3-pyqt5.qtopengl python3-zmq python3-xdg \
            libfuse2 desktop-file-utils

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Freeze with cx_Freeze
        run: python3 freeze.py build --git-branch=production

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool && chmod +x appimagetool

          # Create AppDir structure
          APPDIR="Zenvi.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/metainfo"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$APPDIR/usr/bin/"

          # Desktop file
          cp xdg/*.desktop "$APPDIR/usr/share/applications/" 2>/dev/null || true
          cp xdg/*.desktop "$APPDIR/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$APPDIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
            cp "$ICON" "$APPDIR/zenvi.png"
          fi

          # AppRun
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$HERE/usr/bin/lib:$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/bin"
          exec "$HERE/usr/bin/zenvi" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" \
            "Zenvi-v${VER}-x86_64.AppImage"

      - name: Build .deb package
        run: |
          DEB_DIR="zenvi_${VER}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/zenvi"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$DEB_DIR/usr/share/zenvi/"

          # Launcher script
          cat > "$DEB_DIR/usr/bin/zenvi" << 'LAUNCHER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/usr/share/zenvi:/usr/share/zenvi/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/usr/share/zenvi"
          exec /usr/share/zenvi/zenvi "$@"
          LAUNCHER
          chmod +x "$DEB_DIR/usr/bin/zenvi"

          # Desktop file
          cp xdg/*.desktop "$DEB_DIR/usr/share/applications/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
          fi

          # Control file
          cat > "$DEB_DIR/DEBIAN/control" << CTRL
          Package: zenvi
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libopenshot-dev, python3
          Maintainer: Zenvi Team <team@zenvi.pro>
          Description: Zenvi Video Editor
           Create and edit stunning videos, films, and animations.
          CTRL

          dpkg-deb --build "$DEB_DIR" "Zenvi-v${VER}-x86_64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            Zenvi-v*.AppImage
            Zenvi-v*.deb

  # ── 3. macOS build (.dmg) — matrix for Intel (x86_64) + Apple Silicon (arm64) ──
  build-macos:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    env:
      VER: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      APP_NAME: Zenvi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          # pyobjc is needed by some cx_Freeze macOS hooks
          pip3 install pyobjc-framework-Cocoa 2>/dev/null || true

      - name: Freeze with cx_Freeze (bdist_mac)
        run: python3 freeze.py bdist_mac --git-branch=production

      - name: Structure .app bundle and ad-hoc sign
        run: |
          # Find the .app produced by bdist_mac
          APP_BUNDLE=$(find build -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: No .app bundle found in build/. The freeze step failed."
            exit 1
          fi

          # Normalise name
          EXPECTED="build/${APP_NAME}.app"
          if [ "$APP_BUNDLE" != "$EXPECTED" ]; then
            mv "$APP_BUNDLE" "$EXPECTED"
          fi

          OS_PATH="$EXPECTED/Contents"
          mkdir -p "$OS_PATH/MacOS" "$OS_PATH/Resources"

          # Substitute VERSION placeholder in Info.plist
          cp installer/Info.plist "$OS_PATH/Info.plist"
          sed -i '' "s/VERSION/${VER}/g" "$OS_PATH/Info.plist"

          # Move non-code resource folders → Resources and symlink back
          for dir in classes effects emojis images themes language presets \
                     profiles resources settings timeline titles transitions windows blender; do
            SRC="$OS_PATH/MacOS/lib/$dir"
            DST="$OS_PATH/Resources/$dir"
            if [ -d "$SRC" ]; then
              mv "$SRC" "$DST"
              ln -s "../../Resources/$dir" "$SRC"
            fi
          done

          # qtwebengine_locales
          if [ -d "$OS_PATH/MacOS/qtwebengine_locales" ]; then
            mv "$OS_PATH/MacOS/qtwebengine_locales" "$OS_PATH/Resources/"
            ln -s "../Resources/qtwebengine_locales" "$OS_PATH/MacOS/qtwebengine_locales"
          fi

          # qt.conf
          if [ -f "$OS_PATH/MacOS/qt.conf" ]; then
            mv "$OS_PATH/MacOS/qt.conf" "$OS_PATH/Resources/qt.conf"
            ln -s "../Resources/qt.conf" "$OS_PATH/MacOS/qt.conf"
          fi

          # Icon
          if [ -f "$OS_PATH/MacOS/icon.icns" ]; then
            mv "$OS_PATH/MacOS/icon.icns" "$OS_PATH/Resources/icon.icns"
          fi
          if [ ! -f "$OS_PATH/Resources/icon.icns" ]; then
            cp installer/openshot.icns "$OS_PATH/Resources/icon.icns"
          fi

          # Symlink Resources/lib → MacOS/lib (runtime lib lookup)
          if [ ! -L "$OS_PATH/Resources/lib" ]; then
            ln -s "../MacOS/lib" "$OS_PATH/Resources/lib"
          fi

          # Fix permissions — read for all; +x only for Mach-O binaries and entry points.
          # chmod -R a+rx sets execute on text/data files, causing codesign to fail.
          chmod -R a+r "$OS_PATH/"
          find "$OS_PATH" \( -name '*.dylib' -o -name '*.so' \) -exec chmod +x {} \;
          for bin in zenvi launch launch-openshot launch-mac; do
            [ -f "$OS_PATH/MacOS/$bin" ] && chmod +x "$OS_PATH/MacOS/$bin"
          done

          # Ad-hoc code signing — prevents dyld "library not signed" crashes.
          # Note: does NOT suppress macOS Gatekeeper for downloaded apps.
          find build \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign -s - --force "{}" \; 2>/dev/null || true
          codesign -s - --deep --force "$EXPECTED"
          echo "Ad-hoc signing complete."

      - name: Create DMG
        run: |
          DMG_NAME="Zenvi-v${VER}-${ARCH}.dmg"
          hdiutil create \
            -volname "Zenvi" \
            -srcfolder "build/${APP_NAME}.app" \
            -ov -format UDZO \
            "$DMG_NAME"
          echo "DMG created: $DMG_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: Zenvi-v*.dmg
          if-no-files-found: error

  # ── 4. Windows build (.exe) ───────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        shell: powershell

      - name: Freeze with cx_Freeze
        run: python freeze.py build --git-branch=production
        shell: powershell

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build Windows installer with Inno Setup
        run: |
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $ISCC)) {
            Write-Error "ISCC.exe not found at $ISCC"
            exit 1
          }

          # Pass VERSION and the exact cx_Freeze output dir for Python 3.11 x64
          & $ISCC `
            /DVERSION="${env:VER}" `
            /DPY_EXE_DIR="exe.win-amd64-3.11" `
            installer/windows-installer.iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC.exe failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Locate the produced installer (Inno Setup outputs to installer\Output\ by default)
          $exe = Get-ChildItem -Path "installer\Output\" -Filter "Zenvi*.exe" `
                               -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            # Fallback: search entire tree
            $exe = Get-ChildItem -Path "." -Recurse -Filter "*.exe" |
                   Where-Object { $_.Name -notmatch "is_setup" } |
                   Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "No installer .exe found after ISCC run"
            exit 1
          }

          $dest = "Zenvi-v${env:VER}-x86_64.exe"
          Move-Item $exe.FullName $dest
          Write-Host "Installer produced: $dest"
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Zenvi-v*.exe
          if-no-files-found: error

  # ── 5. Create GitHub Release with all artifacts ───────────────────────
  release:
    needs: [version, build-linux, build-macos, build-windows]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
          pattern: "*-package*"

      - name: List artifacts
        run: |
          echo "### Release Artifacts" >> "$GITHUB_STEP_SUMMARY"
          find dist/ -type f | while read f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "?")
            SHA=$(sha256sum "$f" | cut -d' ' -f1)
            echo "- $(basename $f)  ($SIZE bytes, sha256: $SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "$SHA  $(basename $f)" >> dist/SHA256SUMS.txt
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Zenvi ${{ env.TAG }}"
          body: |
            ## Zenvi ${{ env.VER }}

            ### Auto-update
            Users running Zenvi with an active internet connection will receive
            this update automatically.  The download happens silently in the
            background and the new version is applied on the next launch.

            ### Manual download
            | Platform | File |
            |----------|------|
            | Linux (AppImage)    | `Zenvi-v${{ env.VER }}-x86_64.AppImage` |
            | Linux (Debian)      | `Zenvi-v${{ env.VER }}-x86_64.deb` |
            | macOS Intel         | `Zenvi-v${{ env.VER }}-x86_64.dmg` |
            | macOS Apple Silicon | `Zenvi-v${{ env.VER }}-arm64.dmg` |
            | Windows (EXE)       | `Zenvi-v${{ env.VER }}-x86_64.exe` |

            ### Security note
            **macOS:** These builds are ad-hoc signed (no Apple Developer certificate yet).
            macOS Gatekeeper will show an "unidentified developer" warning on first launch.
            To bypass: right-click the app in the DMG → **Open** → click **Open** in the dialog.
            This warning only appears once.

            **Windows:** Without a code-signing certificate, Windows SmartScreen shows
            "Windows protected your PC". Click **More info** → **Run anyway** to proceed.

            ### Checksums
            See `SHA256SUMS.txt` attached to this release.
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
