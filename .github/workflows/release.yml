# ─────────────────────────────────────────────────────────────────────────────
# Zenvi — Release Workflow
#
# Triggers when a version tag (v*.*.*) is pushed. Builds platform-specific
# installers and publishes them as a GitHub Release so the in-app auto-updater
# can pick them up.
#
# Asset naming convention expected by the auto-updater:
#   Linux   → Zenvi-v<VER>-x86_64.AppImage
#   macOS   → Zenvi-v<VER>-x86_64.dmg   (Intel)
#             Zenvi-v<VER>-arm64.dmg     (Apple Silicon)
#   Windows → Zenvi-v<VER>-x86_64.exe
# ─────────────────────────────────────────────────────────────────────────────
name: Zenvi Production Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed for creating releases & uploading assets

env:
  # Parsed from src/classes/info.py at build time
  APP_NAME: Zenvi

jobs:

  # ── 1. Read the version from source so every job can reference it ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from info.py
        id: ver
        run: |
          VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/classes/info.py').read_text()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${VER}"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "### Version: $VER" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Linux build (AppImage + .deb) ──────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:openshot.developers/libopenshot-daily
          sudo apt-get update
          sudo apt-get install -y \
            libopenshot-audio-dev libopenshot-dev python3-openshot \
            libfuse2 desktop-file-utils

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Freeze with cx_Freeze
        run: python3 freeze.py build --git-branch=production

      - name: Smoke test frozen zenvi
        run: |
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.linux-*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.linux-* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Frozen directory: $FROZEN_DIR"
          # Force PyOpenGL to use a headless/null platform on CI runners that lack GLX
          export PYOPENGL_PLATFORM=null
          "$FROZEN_DIR/zenvi" -V 2>&1 || "$FROZEN_DIR/zenvi" --version 2>&1 || {
            echo "::error::Frozen zenvi failed basic startup/version check"
            exit 1
          }

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool && chmod +x appimagetool

          # Create AppDir structure
          APPDIR="Zenvi.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/metainfo"

          # Copy frozen build
          cp -r build/exe.linux-*/* "$APPDIR/usr/bin/"

          # Desktop file
          cp xdg/*.desktop "$APPDIR/usr/share/applications/" 2>/dev/null || true
          cp xdg/*.desktop "$APPDIR/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$APPDIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
            cp "$ICON" "$APPDIR/zenvi.png"
          fi

          # AppRun
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$HERE/usr/bin/lib:$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/bin"
          exec "$HERE/usr/bin/zenvi" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" \
            "Zenvi-v${VER}-x86_64.AppImage"

      - name: Build .deb package
        run: |
          DEB_DIR="zenvi_${VER}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/zenvi"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.linux-*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.linux-* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Using frozen directory: $FROZEN_DIR"

          # Copy frozen build into /opt/zenvi (self-contained layout)
          cp -r "$FROZEN_DIR"/* "$DEB_DIR/opt/zenvi/"

          # Launcher script
          cat > "$DEB_DIR/usr/bin/zenvi" << 'LAUNCHER'
          #!/bin/bash
          HERE="/opt/zenvi"
          export LD_LIBRARY_PATH="$HERE:$HERE/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH="$HERE/lib:${PYTHONPATH}"
          export QT_PLUGIN_PATH="$HERE"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$HERE/plugins/platforms"
          export OPENSSL_CONF="/dev/null"
          exec "$HERE/zenvi" "$@"
          LAUNCHER
          chmod +x "$DEB_DIR/usr/bin/zenvi"

          # Desktop file
          cp xdg/*.desktop "$DEB_DIR/usr/share/applications/" 2>/dev/null || true

          # Icon
          ICON=$(find images xdg -name "*.png" -path "*256*" 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            cp "$ICON" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/zenvi.png"
          fi

          # Control file
          cat > "$DEB_DIR/DEBIAN/control" << CTRL
          Package: zenvi
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: python3
          Maintainer: Zenvi Team <team@zenvi.org>
          Description: Zenvi Video Editor
           Create and edit stunning videos, films, and animations.
          CTRL

          dpkg-deb --build "$DEB_DIR" "Zenvi-v${VER}-x86_64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            Zenvi-v*.AppImage
            Zenvi-v*.deb

  # ── 3. macOS build (.dmg) ─────────────────────────────────────────────
  # Produces two DMGs: Intel (x86_64) and Apple Silicon (arm64).
  # Both jobs run on macos-15 (Apple Silicon). macos-13 (last Intel runner)
  # was retired by GitHub. x86_64 build uses Rosetta 2 Python (architecture: x64)
  # so cx_Freeze produces an x86_64-native frozen app that runs on Intel Macs.
  # arm64 build uses the native Apple Silicon Python.
  #
  # Note: libopenshot Python bindings are NOT bundled in this CI build.
  # The OpenShot .so from their app bundle is linked against their bundled
  # Python dylibs (not our CI Python), so cx_Freeze cannot package it.
  # The app installs and launches; video editing requires libopenshot to be
  # installed separately. Full bundled video support will come with proper
  # macOS build infrastructure.
  build-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon; x64 Python via Rosetta → x86_64 app
            arch: x86_64
          - runner: macos-14   # macOS 14 Sonoma arm64; targets macOS 14+ users
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VER: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # x86_64: force Rosetta Python so the frozen app is x86_64.
      - name: Set up Python 3.11 (x86_64, via Rosetta)
        if: matrix.arch == 'x86_64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      # arm64: use native Apple Silicon Python (no architecture override).
      - name: Set up Python 3.11 (arm64, native)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build libopenshot from source only for arm64 (native build, no cross-compilation).
      # x86_64 skips this: cross-compiling C++ for x86_64 via Rosetta is complex and
      # the Homebrew Qt5/ffmpeg bottles are arm64-only on macos-15 runners.
      - name: Cache libopenshot build
        id: cache-libopenshot
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: /tmp/libopenshot-install
          key: libopenshot-v0.5.0-audio-v0.5.0-arm64-macos14-py311-v1

      - name: Build libopenshot from source (arm64 only)
        if: matrix.arch == 'arm64' && steps.cache-libopenshot.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          INSTALL_PREFIX="/tmp/libopenshot-install"
          mkdir -p "$INSTALL_PREFIX"

          # Install build dependencies (Homebrew arm64 bottles)
          # cppzmq provides zmq.hpp C++ header (separate from zeromq's libzmq/zmq.h)
          brew install swig zeromq cppzmq libsamplerate qt@5 || true
          brew install ffmpeg 2>/dev/null || true

          QT5_PREFIX="$(brew --prefix qt@5)"
          LIBOMP_PREFIX="$(brew --prefix libomp)"

          # Build libopenshot-audio v0.5.0 (JUCE 7 — has arm64 fix, satisfies >=0.4.0)
          git clone --depth=1 --branch v0.5.0 \
            https://github.com/OpenShot/libopenshot-audio.git /tmp/libopenshot-audio
          cmake -S /tmp/libopenshot-audio -B /tmp/libopenshot-audio/build \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libopenshot-audio/build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install /tmp/libopenshot-audio/build

          # Build libopenshot v0.5.0 with Python bindings
          git clone --depth=1 --branch v0.5.0 \
            https://github.com/OpenShot/libopenshot.git /tmp/libopenshot

          # Patch cmake files:
          # 1. Remove avresample (dropped in FFmpeg 5+)
          find /tmp/libopenshot -name "CMakeLists.txt" -o -name "*.cmake" | \
            xargs grep -l "avresample" 2>/dev/null | \
            xargs sed -i '' 's/ avresample//g'
          # 2. Completely disable OpenMP in cmake (prevents NOTFOUND linker errors).
          #    A stub omp.h (step 3) satisfies the #include <omp.h> in source files.
          find /tmp/libopenshot -name "CMakeLists.txt" | \
            xargs grep -l "find_package.*OpenMP" 2>/dev/null | \
            xargs sed -i '' \
              's/find_package(OpenMP[^)]*)/set(OpenMP_FOUND FALSE) # disabled for macOS CI/g'

          # 3. Write a stub omp.h with all omp_* functions as inline stubs.
          #    OpenMPUtilities.h includes omp.h and defines macros using omp_get_num_procs;
          #    the stub satisfies those references without needing the real OpenMP runtime.
          mkdir -p /tmp/omp-stub
          printf '#ifndef _OMP_H_STUB\n#define _OMP_H_STUB\ntypedef int omp_lock_t;\nstatic inline int omp_get_num_procs(void){return 4;}\nstatic inline int omp_get_num_threads(void){return 1;}\nstatic inline int omp_get_thread_num(void){return 0;}\nstatic inline int omp_get_max_threads(void){return 1;}\nstatic inline void omp_set_num_threads(int n){(void)n;}\nstatic inline int omp_in_parallel(void){return 0;}\nstatic inline double omp_get_wtime(void){return 0.0;}\nstatic inline void omp_init_lock(int*l){(void)l;}\nstatic inline void omp_destroy_lock(int*l){(void)l;}\nstatic inline void omp_set_lock(int*l){(void)l;}\nstatic inline void omp_unset_lock(int*l){(void)l;}\nstatic inline int omp_test_lock(int*l){(void)l;return 1;}\n#endif\n' > /tmp/omp-stub/omp.h

          # 4. FFmpeg 7/8 compat patches in all libopenshot .cpp source files:
          #    a. FF_PROFILE_* macros removed in FFmpeg 8 — replace with AV_PROFILE_*
          python3 -c 'import glob; [open(f,"w").write(t.replace("FF_PROFILE_H264_BASELINE","AV_PROFILE_H264_BASELINE").replace("FF_PROFILE_H264_CONSTRAINED","AV_PROFILE_H264_CONSTRAINED").replace("FF_PROFILE_H264_MAIN","AV_PROFILE_H264_MAIN").replace("FF_PROFILE_H264_HIGH","AV_PROFILE_H264_HIGH")) for f in glob.glob("/tmp/libopenshot/**/*.cpp",recursive=True) if "FF_PROFILE_" in (t:=open(f).read())]'
          #    b. av_stream_add_side_data removed in FFmpeg 7+ — replace with no-op
          python3 -c 'import re,glob; [open(f,"w").write(re.sub(r"av_stream_add_side_data\([^;]*\);","(void)0; /* removed FFmpeg7+ */",t)) for f in glob.glob("/tmp/libopenshot/**/*.cpp",recursive=True) if "av_stream_add_side_data" in (t:=open(f).read())]'
          #    c. AVStream::nb_side_data and AVStream::side_data removed in FFmpeg 7+
          #       (moved to AVStream::codecpar->nb_coded_side_data / coded_side_data)
          python3 -c 'import glob; [open(f,"w").write(t.replace("->nb_side_data","->codecpar->nb_coded_side_data").replace("->side_data[","->codecpar->coded_side_data[")) for f in glob.glob("/tmp/libopenshot/**/*.cpp",recursive=True) if "nb_side_data" in (t:=open(f).read())]'

          cmake -S /tmp/libopenshot -B /tmp/libopenshot/build \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_RUBY=OFF \
            -DENABLE_JAVA=OFF \
            -DENABLE_PYTHON=ON \
            -DPython3_EXECUTABLE="$(which python3)" \
            -DCMAKE_CXX_FLAGS="-I/tmp/omp-stub -Wno-deprecated-declarations" \
            -DCMAKE_PREFIX_PATH="$INSTALL_PREFIX;$QT5_PREFIX"
          cmake --build /tmp/libopenshot/build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install /tmp/libopenshot/build

      - name: Verify libopenshot Python bindings (arm64)
        if: matrix.arch == 'arm64'
        run: |
          INSTALL_PREFIX="/tmp/libopenshot-install"
          PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")

          # cmake installs Python bindings to $INSTALL_PREFIX/python (PYTHON_MODULE_PATH default)
          # Fall back to site-packages if not found there.
          if [ -f "$INSTALL_PREFIX/python/openshot.py" ] || [ -f "$INSTALL_PREFIX/python/_openshot.so" ]; then
            PYROOT="$INSTALL_PREFIX/python"
          else
            PYROOT="$INSTALL_PREFIX/lib/python${PYVER}/site-packages"
          fi

          echo "ZENVI_OPENSHOT_PYROOT=$PYROOT" >> $GITHUB_ENV
          echo "ZENVI_OPENSHOT_INSTALL=$INSTALL_PREFIX" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$INSTALL_PREFIX/lib:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV

          # Verify the binding is importable
          DYLD_LIBRARY_PATH="$INSTALL_PREFIX/lib" PYTHONPATH="$PYROOT" \
            python3 -c "import openshot; print(f'libopenshot version: {openshot.OPENSHOT_VERSION_FULL}')"

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyobjc-framework-Cocoa 2>/dev/null || true

      - name: Freeze with cx_Freeze
        run: |
          python3 freeze.py build --git-branch=production

      - name: Assemble .app bundle
        run: |
          FROZEN_DIR=$(find build -maxdepth 1 -type d -name 'exe.*' | head -1)
          if [ -z "$FROZEN_DIR" ]; then
            echo "::error::cx_Freeze output directory build/exe.* not found"
            ls -la build/ || true
            exit 1
          fi
          echo "Frozen directory: $FROZEN_DIR"

          APP="Zenvi.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp -R "$FROZEN_DIR"/* "$APP/Contents/MacOS/"
          sed "s/VERSION/${VER}/g" installer/Info.plist > "$APP/Contents/Info.plist"
          cp "$APP/Contents/Info.plist" "$APP/Contents/Resources/Info.plist"

          [ -f "installer/zenvi.icns" ] \
            && cp "installer/zenvi.icns" "$APP/Contents/Resources/icon.icns"

          # Make all files readable but do NOT add +x to everything.
          # chmod -R a+rx would give execute bits to text/data files (e.g.
          # frozen_application_license.txt, .hash, .json), which makes codesign
          # treat them as unsigned code objects and refuse to sign the bundle.
          chmod -R a+r "$APP/Contents/"

          # Give execute permission to Mach-O libraries and known entry points.
          # Info.plist declares CFBundleExecutable=launch-mac, so that must be +x too.
          find "$APP" \( -name '*.dylib' -o -name '*.so' \) -exec chmod +x {} \;
          for bin in zenvi launch launch-zenvi launch-mac; do
            [ -f "$APP/Contents/MacOS/$bin" ] && chmod +x "$APP/Contents/MacOS/$bin"
          done

          # Ad-hoc sign every Mach-O binary detected by content (magic bytes), not by
          # file extension. Extension-only filtering (.dylib/.so) misses binaries with
          # unusual names, causing codesign to fail with "code object is not signed at
          # all" for each missed file. Bundle-level signing (codesign APP) is skipped:
          # ad-hoc signing provides no Gatekeeper bypass (that needs a Developer ID
          # cert), so signing individual binaries is both necessary and sufficient to
          # prevent dyld crashes on macOS 12+.
          while IFS= read -r -d '' f; do
            file "$f" 2>/dev/null | grep -q "Mach-O" \
              && codesign -s - --force "$f" 2>/dev/null || true
          done < <(find "$APP/Contents" -type f -print0)
          echo "Signing complete. Contents:"
          ls "$APP/Contents/MacOS/" | head -20

      - name: Create DMG
        run: |
          DMG_NAME="Zenvi-v${VER}-${ARCH}.dmg"
          rm -rf dmgroot && mkdir -p dmgroot

          # Use ditto (not cp -R) — macOS-native bundle copy; handles resource
          # forks and works more reliably with the security layer after codesigning.
          ditto "Zenvi.app" "dmgroot/Zenvi.app"
          ln -s /Applications dmgroot/Applications

          # Strip quarantine and other extended attributes that keep security
          # daemons (trustd, XProtect, mds_stores) attached to files, which
          # causes hdiutil to fail with EBUSY.
          xattr -cr dmgroot/ 2>/dev/null || true

          # Retry loop: macOS security daemons scan newly signed binaries
          # asynchronously; they typically release file handles within ~5 seconds.
          for attempt in 1 2 3; do
            echo "hdiutil attempt $attempt ..."
            hdiutil create -volname "Zenvi" -srcfolder dmgroot \
              -ov -format UDZO "$DMG_NAME" && break
            [ "$attempt" -lt 3 ] && sleep 5
          done

          [ -f "$DMG_NAME" ] || { echo "::error::DMG not created after 3 attempts"; exit 1; }
          echo "Created $DMG_NAME ($(du -sh "$DMG_NAME" | cut -f1))"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: Zenvi-v*.dmg
          if-no-files-found: error

  # ── 4. Windows build (.exe) ───────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        shell: powershell

      - name: Install OpenShot (libopenshot Python bindings)
        shell: powershell
        run: |
          choco install openshot -y --no-progress

          $roots = @(
            "C:\Program Files\OpenShot Video Editor",
            "C:\Program Files (x86)\OpenShot Video Editor"
          )

          $initPy = $null
          $pyd = $null
          $foundRoot = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              # Prefer locating the real Python package root (site-packages parent),
              # so we don't accidentally shadow stdlib modules (e.g. encodings).
              $initPy = Get-ChildItem -Path $root -Recurse -Filter "__init__.py" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\openshot\\__init__\.py$" } |
                Select-Object -First 1
              if ($initPy) { $foundRoot = $root; break }

              $pyd = Get-ChildItem -Path $root -Recurse -Filter "_openshot.pyd" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($pyd) { $foundRoot = $root; break }
            }
          }

          if (-not $foundRoot) {
            throw "Could not locate OpenShot installation root"
          }

          $installRoot = $foundRoot
          $bindDir = $null
          $pythonPathRoot = $null

          if ($initPy) {
            $bindDir = Split-Path -Parent $initPy.FullName   # ...\openshot
            $pythonPathRoot = Split-Path -Parent $bindDir    # ...\site-packages
          } elseif ($pyd) {
            $bindDir = $pyd.Directory.FullName
            $pythonPathRoot = $bindDir
            if ($pyd.Directory.Name -ieq "openshot") {
              $pythonPathRoot = $pyd.Directory.Parent.FullName
            }
          }

          if (-not $bindDir -or -not $pythonPathRoot) {
            throw "Could not determine Python path root for OpenShot bindings"
          }

          $binDir = Join-Path $installRoot "bin"

          Write-Host "OpenShot install root: $installRoot"
          Write-Host "OpenShot bindings dir: $bindDir"
          Write-Host "OpenShot PYTHONPATH root: $pythonPathRoot"

          # IMPORTANT:
          # Do NOT set PYTHONPATH here. Some OpenShot distributions bundle a partial/alternate
          # Python stdlib under their install tree, which can shadow stdlib modules (e.g.
          # encodings) and crash Python during initialization.
          #
          # Instead, pass the path to freeze.py via a dedicated env var, and let freeze.py
          # append it to sys.path at runtime (after Python has initialized).
          Add-Content $env:GITHUB_ENV "PYTHONPATH="
          Add-Content $env:GITHUB_ENV "ZENVI_OPENSHOT_PYROOT=$pythonPathRoot"
          Add-Content $env:GITHUB_ENV "ZENVI_OPENSHOT_BINDDIR=$bindDir"
          if (Test-Path $binDir) {
            Add-Content $env:GITHUB_ENV "PATH=$bindDir;$binDir;$installRoot;$env:PATH"
          } else {
            Add-Content $env:GITHUB_ENV "PATH=$bindDir;$installRoot;$env:PATH"
          }

      - name: Verify OpenShot Python bindings
        shell: powershell
        run: |
          python -c "import os, sys; print(sys.version); print('PYTHONPATH:', os.environ.get('PYTHONPATH')); sys.path.append(os.environ['ZENVI_OPENSHOT_PYROOT']); import openshot; print('openshot:', getattr(openshot, '__file__', openshot))"

      - name: Freeze with cx_Freeze
        run: python freeze.py build --git-branch=production

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build with Inno Setup
        run: |

          # Build installer (deterministically name output + package correct cx_Freeze dir)
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $ISCC)) { throw "Inno Setup compiler not found at $ISCC" }

          $exeDir = Get-ChildItem -Path "build" -Directory -Filter "exe.*" | Select-Object -First 1
          if (!$exeDir) { throw "cx_Freeze output directory build/exe.* not found" }
          $pyExeDir = $exeDir.Name

          & $ISCC `
            /DVERSION="${env:VER}" `
            /DPY_EXE_DIR="$pyExeDir" `
            /F"Zenvi-v${env:VER}-x86_64" `
            /O"." `
            installer/windows-installer.iss

          if (!(Test-Path "Zenvi-v${env:VER}-x86_64.exe")) {
            throw "Expected installer Zenvi-v${env:VER}-x86_64.exe not created"
          }
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Zenvi-v*.exe
          if-no-files-found: error

  # ── 5. Create GitHub Release with all artifacts ───────────────────────
  # Run even if some platform builds fail so that successful artifacts
  # are still published.
  release:
    needs: [version, build-linux, build-macos, build-windows]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Download each platform's artifacts separately so that a missing one
      # does not prevent the others from being collected.
      - name: Download Linux artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts (Intel x86_64)
        uses: actions/download-artifact@v4
        with:
          name: macos-package-x86_64
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts (Apple Silicon arm64)
        uses: actions/download-artifact@v4
        with:
          name: macos-package-arm64
          path: dist/
        continue-on-error: true

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist/
        continue-on-error: true

      - name: Ensure at least one artifact exists
        run: |
          mkdir -p dist
          COUNT=$(find dist/ -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No build artifacts found — all platform builds failed"
            exit 1
          fi
          echo "Found $COUNT artifact(s):"
          find dist/ -type f -exec ls -lh {} \;

      - name: Generate checksums
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove legacy production release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view production >/dev/null 2>&1; then
            gh release delete production --yes --cleanup-tag || true
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/production" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/production" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Zenvi v${{ env.VER }}"
          body: |
            ## What's New

            See the [commit log](https://github.com/${{ github.repository }}/compare/v${{ env.VER }}...HEAD) for a full list of changes.

            ## Downloads

            | Platform | Installer |
            |----------|-----------|
            | **Linux** (AppImage) | `Zenvi-v${{ env.VER }}-x86_64.AppImage` |
            | **Linux** (Debian/Ubuntu) | `Zenvi-v${{ env.VER }}-x86_64.deb` |
            | **macOS** (Intel) | `Zenvi-v${{ env.VER }}-x86_64.dmg` |
            | **macOS** (Apple Silicon) | `Zenvi-v${{ env.VER }}-arm64.dmg` |
            | **Windows** | `Zenvi-v${{ env.VER }}-x86_64.exe` |

            > **Note:** Some platform installers may not be available if the build for that platform is still in progress.

            ## Checksums

            See `SHA256SUMS.txt` for verification.
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
